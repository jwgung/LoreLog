name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # 태그 없이 수동 실행해 빌드만 검증할 때

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        id: ver
        run: |
          # versionCode 는 태그에서 유도(major*10000 + minor*100 + patch): v0.3.15 → 315.
          # run_number 를 쓰면 로컬 빌드(versionCode 8~15)보다 작아져 다운그레이드로 설치가 막힌다.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            IFS=. read -r a b c <<< "${name%%-*}"
            echo "name=${name}" >> "$GITHUB_OUTPUT"
            echo "code=$(( ${a:-0} * 10000 + ${b:-0} * 100 + ${c:-0} ))" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -Plifelog.storeFile="$RUNNER_TEMP/release.jks"
          -Plifelog.storePassword="${{ secrets.RELEASE_STORE_PASSWORD }}"
          -Plifelog.keyAlias="${{ secrets.RELEASE_KEY_ALIAS }}"
          -Plifelog.keyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}"
          -PappVersionName="${{ steps.ver.outputs.name }}"
          -PappVersionCode="${{ steps.ver.outputs.code }}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "LoreLog-${{ steps.ver.outputs.name }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoreLog-${{ steps.ver.outputs.name }}
          path: LoreLog-${{ steps.ver.outputs.name }}.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: LoreLog ${{ github.ref_name }}
          files: LoreLog-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
