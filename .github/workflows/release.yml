name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # 태그 없이 수동 실행해 빌드만 검증할 때

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -Plifelog.storeFile="$RUNNER_TEMP/release.jks"
          -Plifelog.storePassword="${{ secrets.RELEASE_STORE_PASSWORD }}"
          -Plifelog.keyAlias="${{ secrets.RELEASE_KEY_ALIAS }}"
          -Plifelog.keyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}"
          -PappVersionName="${{ steps.ver.outputs.name }}"
          -PappVersionCode="${{ github.run_number }}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "LoreLog-${{ steps.ver.outputs.name }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoreLog-${{ steps.ver.outputs.name }}
          path: LoreLog-${{ steps.ver.outputs.name }}.apk

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: LoreLog ${{ github.ref_name }}
          files: LoreLog-${{ steps.ver.outputs.name }}.apk
          generate_release_notes: true
