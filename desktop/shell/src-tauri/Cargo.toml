[package]
name = "life-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LoreLog desktop: the assistant screen (bundled), the PC collector, and watched folders"

[lib]
name = "life_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "life-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
life_agent_core = { path = "../../core" }
life-agent = { path = "../../agent" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
url = "2"
