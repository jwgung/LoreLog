<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>일정</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<style>
  body { overflow: auto; }
  .swrap { max-width: 720px; margin: 0 auto; padding: 16px 20px 40px; }
  .swrap a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
  .snav { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
  .snav button { padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .snav .span { flex: 1; text-align: center; color: var(--muted); font-size: 14px; }
  .sday { margin: 18px 0 6px; font-size: 13px; color: var(--muted); }
  .snone { font-size: 13px; color: var(--muted); opacity: .7; }
  .sevent { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: inherit; }
  .sevent:hover { border-color: var(--accent); }
  .stitle { font-size: 15px; }
  .smeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .snote { font-size: 13px; margin-top: 4px; }
  .snote.request { color: var(--warn); }
  .snote.guess { color: var(--muted); }
  .smsg { min-height: 1.2em; margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="swrap">
  <a class="back" href="index.html">← 대화로</a>
  <h1 style="margin:10px 0 0;">일정</h1>
  <p class="muted">금고에 들어온 일정(CalDAV, 폰 캘린더)에 비서가 아는 것을 얹어 보여 줍니다. 확실한 것이 없으면 비워 두고, 기록에서 읽어 낸 것은 추정이라고 씁니다. 일정을 누르면 그 일정에 대해 대화로 묻습니다.</p>
  <div class="snav">
    <button type="button" id="prev">‹ 앞 주</button>
    <span class="span" id="span"></span>
    <button type="button" id="today">오늘부터</button>
    <button type="button" id="next">다음 주 ›</button>
  </div>
  <p class="smsg" id="smsg"></p>
  <div id="days"></div>
</div>
<script src="schedule.js"></script>
</body>
</html>
