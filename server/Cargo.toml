[package]
name = "life-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "life server: raw store, diary assistant, librarian and collectors. A library first, so the desktop app can run it too."

[lib]
name = "life_server"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = "0.4.45"
dirs = "7.0.0"
hex = "0.4.3"
indexmap = "2.14.2"
percent-encoding = "2.3.2"
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "1.1.8"

[dev-dependencies]
chrono = "0.4.45"
percent-encoding = "2.3.2"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "macros"] }
ureq = { version = "3.5.0", features = ["json"] }
